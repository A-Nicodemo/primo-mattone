<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Kitchen x Disco Risotto</title>
<style>
  :root {
    --teal-900: #04342C;
    --teal-200: #9FE1CB;
    --teal-400: #5DCAA5;
    --coral-500: #D85A30;
    --coral-900: #4A1B0C;
    --cream: #FAECE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--teal-900); color: var(--cream);
    font-family: -apple-system, sans-serif; display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 420px; padding: 0 0 60px; text-align: center; }
  .hero { width: 100%; display: block; }
  .kicker { font-size: 13px; letter-spacing: 0.08em; color: var(--teal-200); margin: 18px 0; }
  .desc { font-size: 14px; color: var(--teal-200); line-height: 1.6; max-width: 300px; margin: 0 auto; padding: 0 22px; }
  form { margin-top: 28px; text-align: left; padding: 0 22px; }
  fieldset { border: none; padding: 0; margin: 22px 0 0; }
  legend { font-size: 12px; color: var(--teal-400); text-transform: uppercase; letter-spacing: 0.05em; padding: 0; margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--teal-400); margin: -2px 0 4px; }
  label { display: block; font-size: 13px; color: var(--teal-200); margin: 14px 0 6px; }
  input, textarea {
    width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--teal-400);
    background: transparent; color: var(--cream); font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  button {
    margin-top: 22px; width: 100%; background: var(--coral-500); color: var(--coral-900);
    border: none; padding: 13px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 16px; font-size: 14px; }
  .msg.err { color: #F0997B; }
  .conferma { display: none; margin-top: 26px; padding: 0 22px; }
  .conferma p { font-size: 14px; color: var(--teal-200); line-height: 1.6; }
  a.pagamento {
    display: block; margin-top: 16px; background: var(--coral-500); color: var(--coral-900);
    text-decoration: none; padding: 13px; border-radius: 8px; font-weight: 600;
  }
</style>
</head>

<script>
  // Sostituisci con l'URL della tua Web App Apps Script
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDVkQyvecG5KqN3KDA6-of-52FBPUOj_jYCPRAPCaTuVH0PrMHuoXc-k6XO1agBns/exec';

  function jsonp(params, callback) {
    var cbName = 'cb_' + Date.now();
    window[cbName] = function (data) {
      callback(data);
      delete window[cbName];
      script.remove();
    };
    params.callback = cbName;
    var query = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var script = document.createElement('script');
    script.src = SCRIPT_URL + '?' + query;
    document.body.appendChild(script);
  }

  document.getElementById('formPrenotazione').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('btnInvia');
    var msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = '';
    msg.className = 'msg';

    var dati = {
      nome: document.getElementById('nome').value,
      cognome: document.getElementById('cognome').value,
      codiceFiscale: document.getElementById('codiceFiscale').value,
      email: document.getElementById('email').value,
      telefono: document.getElementById('telefono').value,
      indirizzo: document.getElementById('indirizzo').value,
      citta: document.getElementById('citta').value,
      cap: document.getElementById('cap').value,
      note: document.getElementById('note').value
    };

    jsonp({ action: 'registra', dati: JSON.stringify(dati) }, function (res) {
      btn.disabled = false;
      if (res.ok) {
        document.getElementById('formPrenotazione').style.display = 'none';
        document.getElementById('conferma').style.display = 'block';
        document.getElementById('linkPagamento').href = res.linkPagamento;
      } else {
        msg.textContent = res.errore || 'Errore, riprova.';
        msg.className = 'msg err';
      }
    });
  });
</script>
</body>
</html>

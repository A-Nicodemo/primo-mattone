<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Primo Mattone — Gestione Token</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --sage: #adc2b6; --wine: #6b1a1a; --cream: #f0ebe0; --dark: #1a1a1a; --ok: #1e7e45; --warn: #b86b00; --err: #b52a2a; }
body { background: var(--sage); font-family: 'Barlow', sans-serif; min-height: 100vh; color: var(--dark); -webkit-tap-highlight-color: transparent; }
.header { background: var(--wine); padding: 14px 18px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--cream); line-height: 1; }
.header-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(240,235,224,0.55); margin-top: 1px; }
.tabs { display: flex; background: rgba(0,0,0,0.12); position: sticky; top: 56px; z-index: 99; }
.tab-btn { flex: 1; padding: 11px 4px; border: none; background: transparent; color: rgba(107,26,26,0.55); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.18s; }
.tab-btn.active { color: var(--wine); border-bottom-color: var(--wine); background: rgba(255,255,255,0.18); }
.tab-panel { display: none; padding: 16px 14px 48px; }
.tab-panel.active { display: block; }
.card { background: var(--cream); border-radius: 6px; padding: 18px; margin-bottom: 12px; }
.card-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9a8a7a; margin-bottom: 12px; }
.qty-row { display: flex; align-items: center; gap: 12px; }
.qty-btn { width: 52px; height: 52px; border: 2px solid var(--wine); border-radius: 5px; background: transparent; color: var(--wine); font-size: 28px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; }
.qty-btn:active { background: var(--wine); color: var(--cream); }
.qty-center { text-align: center; flex: 1; }
.qty-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 56px; color: var(--wine); line-height: 1; }
.qty-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; margin-top: 1px; }
.qty-plus5 { padding: 10px 14px; border: 2px solid rgba(107,26,26,0.35); border-radius: 5px; background: white; color: var(--wine); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.12s; flex-shrink: 0; }
.qty-plus5:active { background: var(--wine); color: var(--cream); }
.value-row { display: flex; gap: 8px; }
.value-btn { flex: 1; padding: 12px 6px; border: 2px solid rgba(107,26,26,0.22); border-radius: 5px; background: white; color: #777; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; cursor: pointer; text-align: center; transition: all 0.15s; }
.value-btn.sel { border-color: var(--wine); background: var(--wine); color: var(--cream); }
.method-row { display: flex; gap: 10px; }
.method-btn { flex: 1; padding: 13px 8px; border: 2px solid rgba(107,26,26,0.22); border-radius: 5px; background: white; color: #777; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; text-align: center; transition: all 0.15s; }
.method-btn.sel { border-color: var(--wine); background: var(--wine); color: var(--cream); }
.total-row { display: flex; justify-content: space-between; align-items: center; background: rgba(107,26,26,0.07); border-radius: 5px; padding: 12px 16px; }
.total-lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--wine); }
.total-amt { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 30px; color: var(--wine); }
.btn-primary { width: 100%; padding: 16px; background: var(--wine); color: var(--cream); border: none; border-radius: 5px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; margin-bottom: 10px; }
.btn-primary:hover { background: #891f1f; }
.btn-primary:disabled { background: #bbb; cursor: not-allowed; }
.btn-outline { width: 100%; padding: 13px; background: transparent; color: var(--wine); border: 2px solid var(--wine); border-radius: 5px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; margin-bottom: 10px; }
.btn-outline:hover { background: var(--wine); color: var(--cream); }
.qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.qr-item { background: white; border-radius: 5px; padding: 10px; text-align: center; border: 1px solid rgba(0,0,0,0.08); }
.qr-item img { width: 100% !important; height: auto !important; }
.qr-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; color: var(--wine); margin-top: 6px; text-transform: uppercase; }
.qr-val { font-size: 11px; color: #aaa; margin-top: 2px; }
select { width: 100%; padding: 13px 14px; border: 2px solid rgba(107,26,26,0.25); border-radius: 5px; font-family: 'Barlow', sans-serif; font-size: 15px; color: var(--dark); background: white; outline: none; }
select:focus { border-color: var(--wine); }
#reader { width: 100% !important; border-radius: 5px; overflow: hidden; min-height: 60px; }
.scan-result { display: none; padding: 22px 16px; border-radius: 6px; text-align: center; margin-top: 12px; }
.scan-result.ok  { background: #d6f0e0; border: 2px solid var(--ok); }
.scan-result.dup { background: #fff3cd; border: 2px solid var(--warn); }
.scan-result.err { background: #fde8e8; border: 2px solid var(--err); }
.scan-icon { font-size: 52px; line-height: 1; margin-bottom: 6px; }
.scan-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; text-transform: uppercase; }
.scan-result.ok  .scan-title { color: var(--ok); }
.scan-result.dup .scan-title { color: var(--warn); }
.scan-result.err .scan-title { color: var(--err); }
.scan-sub { font-size: 13px; color: #666; margin-top: 5px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-card { background: var(--cream); border-radius: 6px; padding: 16px 12px; text-align: center; }
.stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 38px; color: var(--wine); line-height: 1; }
.stat-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: #999; margin-top: 3px; }
table { width: 100%; border-collapse: collapse; }
th { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #999; text-align: left; padding: 7px 8px; border-bottom: 2px solid rgba(107,26,26,0.12); }
td { padding: 10px 8px; border-bottom: 1px solid rgba(107,26,26,0.07); font-size: 14px; }
tr:last-child td { border-bottom: none; }
.td-amt { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--wine); font-size: 16px; }
tfoot td { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; border-top: 2px solid rgba(107,26,26,0.2); border-bottom: none; padding-top: 12px; }
.empty { text-align: center; padding: 28px 16px; color: #aaa; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(107,26,26,0.2); border-top-color: var(--wine); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print {
  body { background: white; }
  .header, .tabs, #panel-scanner, #panel-dashboard, .btn-primary, .btn-outline, #cassa-form { display: none !important; }
  #panel-cassa { display: block !important; padding: 0; }
  #cassa-result { display: block !important; }
  .qr-grid { grid-template-columns: repeat(4, 1fr); }
  .qr-item { break-inside: avoid; }
  .card { box-shadow: none; padding: 0; background: white; margin: 0; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Primo Mattone</div>
    <div class="header-sub">Gestione Token · 2 Maggio 2026</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-cassa" onclick="switchTab('cassa')">🏧 Cassa</button>
  <button class="tab-btn" id="tab-scanner" onclick="switchTab('scanner')">📷 Scanner</button>
  <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
</div>

<!-- CASSA -->
<div id="panel-cassa" class="tab-panel active">
  <div id="cassa-form">
    <div class="card">
      <div class="card-label">Quantità Token</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <div class="qty-center">
          <div class="qty-num" id="qty-num">1</div>
          <div class="qty-lbl">token</div>
        </div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
        <button class="qty-plus5" onclick="changeQty(5)">+5</button>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Valore per Token</div>
      <div class="value-row">
        <button class="value-btn sel" id="vbtn-2"  onclick="selectValue(2)">€2</button>
        <button class="value-btn"     id="vbtn-4"  onclick="selectValue(4)">€4</button>
        <button class="value-btn"     id="vbtn-5"  onclick="selectValue(5)">€5</button>
        <button class="value-btn"     id="vbtn-10" onclick="selectValue(10)">€10</button>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Metodo di Pagamento</div>
      <div class="method-row">
        <button class="method-btn sel" id="m-contanti" onclick="selectMethod('contanti')">💵 Contanti</button>
        <button class="method-btn"     id="m-carta"    onclick="selectMethod('carta')">💳 Carta / POS</button>
      </div>
    </div>
    <div class="card" style="padding:14px 18px">
      <div class="total-row">
        <span class="total-lbl">Totale da incassare</span>
        <span class="total-amt" id="total-amt">€2.00</span>
      </div>
    </div>
    <button class="btn-primary" id="emetti-btn" onclick="emettiToken()">Emetti Token →</button>
  </div>
  <div id="cassa-result" style="display:none">
    <div class="card">
      <div class="card-label" id="qr-label">Token emessi</div>
      <div class="qr-grid" id="qr-grid"></div>
    </div>
    <button class="btn-primary" onclick="window.print()">🖨️ Stampa QR</button>
    <button class="btn-outline" onclick="resetCassa()">← Nuova Vendita</button>
  </div>
</div>

<!-- SCANNER -->
<div id="panel-scanner" class="tab-panel">
  <div class="card">
    <div class="card-label">Seleziona il tuo punto vendita</div>
    <select id="ft-select">
      <option value="">— scegli il punto vendita —</option>
      <option value="Cacio's">Cacio's</option>
      <option value="Birra">Birra</option>
      <option value="Drink">Drink</option>
      <option value="Crunchy">Crunchy</option>
    </select>
  </div>
  <div class="card" style="padding:10px">
    <div id="reader"></div>
  </div>
  <div class="scan-result" id="scan-result">
    <div class="scan-icon" id="scan-icon"></div>
    <div class="scan-title" id="scan-title"></div>
    <div class="scan-sub" id="scan-sub"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="panel-dashboard" class="tab-panel">
  <button class="btn-primary" onclick="loadDashboard()" style="margin-bottom:14px">🔄 Aggiorna Dati</button>
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-val">—</div><div class="stat-lbl">Venduti</div></div>
    <div class="stat-card"><div class="stat-val">—</div><div class="stat-lbl">Usati</div></div>
    <div class="stat-card"><div class="stat-val">—</div><div class="stat-lbl">Rimanenti</div></div>
    <div class="stat-card"><div class="stat-val">—</div><div class="stat-lbl">Incasso €</div></div>
  </div>
  <div class="card">
    <div class="card-label">Rimborso per Punto Vendita</div>
    <div id="ft-table-wrap"><div class="empty">Premi "Aggiorna Dati" per caricare</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var APPS_SCRIPT_URL = 'APPS_SCRIPT_URL';

var qty = 1;
var selectedValue = 2;
var selectedMethod = 'contanti';
var scannerObj = null;
var scannerRunning = false;
var scanLocked = false;

function switchTab(name) {
  ['cassa','scanner','dashboard'].forEach(function(t) {
    document.getElementById('panel-' + t).classList.remove('active');
    document.getElementById('tab-' + t).classList.remove('active');
  });
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'scanner') startScanner();
  else stopScanner();
  if (name === 'dashboard') loadDashboard();
}

function changeQty(delta) {
  qty = qty + delta;
  if (qty < 1) qty = 1;
  if (qty > 50) qty = 50;
  document.getElementById('qty-num').textContent = qty;
  document.getElementById('total-amt').textContent = '€' + (qty * selectedValue).toFixed(2);
}

function selectValue(v) {
  selectedValue = v;
  [2,4,5,10].forEach(function(val) {
    var b = document.getElementById('vbtn-' + val);
    if (b) b.className = 'value-btn' + (val === v ? ' sel' : '');
  });
  document.getElementById('total-amt').textContent = '€' + (qty * selectedValue).toFixed(2);
}

function selectMethod(m) {
  selectedMethod = m;
  document.getElementById('m-contanti').className = 'method-btn' + (m === 'contanti' ? ' sel' : '');
  document.getElementById('m-carta').className    = 'method-btn' + (m === 'carta'    ? ' sel' : '');
}

function emettiToken() {
  if (APPS_SCRIPT_URL === 'APPS_SCRIPT_URL') { alert('⚠️ Inserisci il tuo URL Apps Script nel file'); return; }
  var btn = document.getElementById('emetti-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generazione…';
  var url = APPS_SCRIPT_URL + '?action=crea_token&quantita=' + qty + '&valore=' + selectedValue + '&metodo=' + encodeURIComponent(selectedMethod);
  fetch(url, { redirect: 'follow' })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) throw new Error(data.error || 'Errore');
    renderQR(data.tokens);
  })
  .catch(function(e) {
    alert('Errore: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Emetti Token →';
  });
}

function renderQR(tokens) {
  document.getElementById('cassa-form').style.display = 'none';
  document.getElementById('cassa-result').style.display = 'block';
  document.getElementById('qr-label').textContent = tokens.length + ' token · €' + selectedValue + ' cad · ' + selectedMethod;
  var grid = document.getElementById('qr-grid');
  grid.innerHTML = '';
  tokens.forEach(function(id, i) {
    var item = document.createElement('div');
    item.className = 'qr-item';
    var qrDiv = document.createElement('div');
    var num = document.createElement('div');
    num.className = 'qr-num';
    num.textContent = 'Token ' + (i + 1);
    var val = document.createElement('div');
    val.className = 'qr-val';
    val.textContent = '€' + selectedValue;
    item.appendChild(qrDiv);
    item.appendChild(num);
    item.appendChild(val);
    grid.appendChild(item);
    new QRCode(qrDiv, { text: id, width: 128, height: 128, colorDark: '#6b1a1a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  });
}

function resetCassa() {
  document.getElementById('cassa-form').style.display = 'block';
  document.getElementById('cassa-result').style.display = 'none';
  document.getElementById('emetti-btn').disabled = false;
  document.getElementById('emetti-btn').textContent = 'Emetti Token →';
  document.getElementById('qr-grid').innerHTML = '';
  qty = 1;
  document.getElementById('qty-num').textContent = '1';
  document.getElementById('total-amt').textContent = '€' + selectedValue.toFixed(2);
}

function startScanner() {
  if (scannerRunning) return;
  if (typeof Html5Qrcode === 'undefined') {
    document.getElementById('reader').innerHTML = '<div class="empty">Scanner non caricato, riprova tra un secondo</div>';
    return;
  }
  scannerObj = new Html5Qrcode('reader');
  Html5Qrcode.getCameras()
  .then(function(cameras) {
    if (!cameras || cameras.length === 0) { document.getElementById('reader').innerHTML = '<div class="empty">Fotocamera non trovata</div>'; return; }
    var cam = cameras[cameras.length - 1];
    cameras.forEach(function(c) { if (/back|rear|environment/i.test(c.label)) cam = c; });
    return scannerObj.start(cam.id, { fps: 10, qrbox: { width: 240, height: 240 } }, onScanOK, function(){});
  })
  .then(function() { scannerRunning = true; })
  .catch(function(e) { document.getElementById('reader').innerHTML = '<div class="empty">Errore: ' + (e.message || e) + '</div>'; });
}

function stopScanner() {
  if (scannerObj && scannerRunning) {
    scannerObj.stop().then(function() { scannerRunning = false; scannerObj = null; }).catch(function(){});
  }
}

function onScanOK(decoded) {
  if (scanLocked) return;
  scanLocked = true;
  var ft = document.getElementById('ft-select').value;
  if (!ft) { mostraRis('err','⚠️','SELEZIONA IL PUNTO','prima di scansionare'); setTimeout(function(){ scanLocked=false; nascondiRis(); }, 2500); return; }
  if (APPS_SCRIPT_URL === 'APPS_SCRIPT_URL') { mostraRis('err','⚠️','URL NON CONFIGURATO',''); setTimeout(function(){ scanLocked=false; nascondiRis(); }, 2500); return; }
  var scanUrl = APPS_SCRIPT_URL + '?action=usa_token&id=' + encodeURIComponent(decoded) + '&food_truck=' + encodeURIComponent(ft);
  fetch(scanUrl, { redirect: 'follow' })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success)                      mostraRis('ok',  '✅', 'TOKEN VALIDO',  '€' + d.valore + ' · ' + ft);
    else if (d.error === 'GIA_USATO')   mostraRis('dup', '⚠️', 'GIÀ USATO',    'Token già scansionato');
    else if (d.error === 'NON_TROVATO') mostraRis('err', '❌', 'NON VALIDO',   'Token non riconosciuto');
    else                                mostraRis('err', '❌', 'ERRORE',       d.error || '');
    setTimeout(function() { scanLocked = false; nascondiRis(); }, 3000);
  })
  .catch(function() { mostraRis('err','⚠️','ERRORE DI RETE','Riprova'); setTimeout(function(){ scanLocked=false; nascondiRis(); }, 3000); });
}

function mostraRis(cls, icon, title, sub) {
  var el = document.getElementById('scan-result');
  el.className = 'scan-result ' + cls;
  document.getElementById('scan-icon').textContent  = icon;
  document.getElementById('scan-title').textContent = title;
  document.getElementById('scan-sub').textContent   = sub;
  el.style.display = 'block';
}
function nascondiRis() { document.getElementById('scan-result').style.display = 'none'; }

function loadDashboard() {
  if (APPS_SCRIPT_URL === 'APPS_SCRIPT_URL') { document.getElementById('ft-table-wrap').innerHTML = '<div class="empty">⚠️ Configura prima APPS_SCRIPT_URL</div>'; return; }
  document.getElementById('stats-grid').innerHTML =
    '<div class="stat-card"><div class="stat-val"><span class="spinner"></span></div><div class="stat-lbl">Caricamento</div></div>' +
    '<div class="stat-card"></div><div class="stat-card"></div><div class="stat-card"></div>';
  document.getElementById('ft-table-wrap').innerHTML = '<div class="empty">Caricamento…</div>';
  fetch(APPS_SCRIPT_URL + '?action=dashboard', { redirect: 'follow' })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (!d.success) throw new Error(d.error);
    document.getElementById('stats-grid').innerHTML =
      '<div class="stat-card"><div class="stat-val">' + d.venduti + '</div><div class="stat-lbl">Venduti</div></div>' +
      '<div class="stat-card"><div class="stat-val">' + d.usati + '</div><div class="stat-lbl">Usati</div></div>' +
      '<div class="stat-card"><div class="stat-val">' + d.rimanenti + '</div><div class="stat-lbl">Rimanenti</div></div>' +
      '<div class="stat-card"><div class="stat-val">€' + d.totale_venduto + '</div><div class="stat-lbl">Incasso</div></div>';
    var ftKeys = Object.keys(d.per_food_truck || {});
    if (ftKeys.length === 0) { document.getElementById('ft-table-wrap').innerHTML = '<div class="empty">Nessun token ancora usato</div>'; return; }
    var tot = 0, rows = '';
    ftKeys.sort().forEach(function(ft) {
      var x = d.per_food_truck[ft]; tot += x.totale;
      rows += '<tr><td>' + ft + '</td><td style="text-align:center">' + x.count + '</td><td class="td-amt" style="text-align:right">€' + x.totale.toFixed(2) + '</td></tr>';
    });
    document.getElementById('ft-table-wrap').innerHTML =
      '<table><thead><tr><th>Punto Vendita</th><th style="text-align:center">Token</th><th style="text-align:right">Da Rimborsare</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>Totale</td><td style="text-align:center">' + d.usati + '</td><td class="td-amt" style="text-align:right">€' + tot.toFixed(2) + '</td></tr></tfoot></table>';
  })
  .catch(function(e) {
    document.getElementById('stats-grid').innerHTML = '<div class="stat-card" style="grid-column:span 2"><div class="empty">Errore: ' + e.message + '</div></div><div></div><div></div>';
    document.getElementById('ft-table-wrap').innerHTML = '<div class="empty">Impossibile caricare</div>';
  });
}
</script>
</body>
</html>
